include:
  - project: widas/software-quality/gitlab-template-projects/widas-customer-ci-templates
    file: java/java-mvn-lib.yml

stages:
  - prepare
  - test
  - build
  - release
  - badges
  - deploy

test:
  stage: test
  image: maven:3-openjdk-17
  script:
      - mvn test
      - awk -F"," '{ covered += $5; total += $4 + $5 } END { print covered, "/", total, "instructions covered"; printf "%s %0.2f", "code coverage:", 100*covered/total; print "%" }' target/site/jacoco/jacoco.csv
  coverage: '/code coverage: ([\d\.]+)%/'
  artifacts:
    expire_in: 1 hrs
    paths:
      - target/*

build:
  extends: .build